# Problem 3 對照組（baseline）：一般的 MLP，只靠 domain randomization，不做 adaptation。
# 訓練：hw2 train adapt/yaw_absolute/ball --config adapt_baseline.yaml
# 評分：hw2 eval adapt/yaw_absolute/ball <run> --config adapt_baseline.yaml --challenge public

reward:
  orientation: {weight: 1.0}
  success: {weight: 250.0}
  obj_linvel: {weight: -0.3}
  pose_diff: {weight: -0.3}
  torque: {weight: -0.1}
  work: {weight: -2.0}

algo:
  obs_groups:
    actor: [actor]       # 評分用：只讀 actor 群組（看不到物理參數）
    critic: [critic]     # 只在訓練時用：critic 可以看到 6 個真實物理參數
  num_envs: 1024
  num_steps_per_env: 24
  max_iterations: 3000
  save_interval: 100
  actor:
    class_name: rsl_rl.models.MLPModel
    hidden_dims: [512, 256, 128]
    activation: elu
    obs_normalization: true
  critic:
    hidden_dims: [512, 256, 128]
    activation: elu
    obs_normalization: true
  algorithm:
    learning_rate: 1.0e-3
    entropy_coef: 0.005
    gamma: 0.99
    lam: 0.95
    desired_kl: 0.01
    num_learning_epochs: 5
    num_mini_batches: 4
