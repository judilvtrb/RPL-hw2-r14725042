# @package _global_
# Multi-object track: ONE policy reorients ball, cube and cylinder. Every env
# holds all three objects (scene_multi.xml); env i's active object is i % 3 and
# resets come from that object's grasp cache. The policy never sees which object
# it holds: the observation is the single-object layout without object_quat
# (109 dims), so the same checkpoint is evaluated on each single-object scene.
defaults:
  - /task/allegro_hold/multi
  - _self_

training:
  task_name: AllegroInhandMulti

env:
  events:
    place_active_object: null
    reset_from_grasp_caches:
      func: hw2_dexhand.tasks.allegro_inhand.terms.reset_from_grasp_caches
      mode: reset
      params:
        object_entities: [object_ball, object_cube, object_cylinder]
        cache_paths:
          object_ball: ${hw2_cache:allegro_ball_grasp_10k.npy}
          object_cube: ${hw2_cache:allegro_cube_grasp_10k.npy}
          object_cylinder: ${hw2_cache:allegro_cylinder_grasp_10k.npy}
        park_positions:
          object_ball: [0.6, 0.3, -0.16]
          object_cube: [0.6, 0.0, -0.165]
          object_cylinder: [-0.6, 0.0, -0.165]
        joint_noise: 0.0
        action_name: hand
        hand_asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
  commands:
    goal:
      _target_: hw2_dexhand.tasks.allegro_inhand.terms.GoalOrientationCommandCfg
      entity_name: objects
      body_names: [object_ball, object_cube, object_cylinder]
      mode: yaw
      frame: absolute
      yaw_range: [-3.141592653589793, 3.141592653589793]
      success_tolerance_rad: 0.4
      resample_on_success: true
      max_consecutive_successes: 0
  observations:
    policy:
      terms:
        goal_rel_quat:
          func: hw2_dexhand.tasks.allegro_inhand.terms.goal_relative_quat
          history_length: 0
          params:
            command_name: goal
            entity_name: objects
            tensor_body_names: [object_ball, object_cube, object_cylinder]
  terminations:
    goal_count_reached:
      func: hw2_dexhand.tasks.allegro_inhand.terms.goal_count_reached
      params:
        command_name: goal

reward:
  alive: null
  action_rate: null
  rotate:
    func: hw2_dexhand.tasks.allegro_inhand.terms.object_angvel_about_axis
    weight: 0.0
    params:
      axis: [0.0, 0.0, 1.0]
      clip: [-0.5, 0.5]
      entity_name: objects
      tensor_body_names: [object_ball, object_cube, object_cylinder]
  orientation:
    func: hw2_dexhand.tasks.allegro_inhand.terms.goal_orientation_reward
    weight: 1.0
    params:
      rot_eps: 0.1
      command_name: goal
      entity_name: objects
      tensor_body_names: [object_ball, object_cube, object_cylinder]
  success:
    func: hw2_dexhand.tasks.allegro_inhand.terms.goal_success
    weight: 250.0
    params:
      command_name: goal
      entity_name: objects
      tensor_body_names: [object_ball, object_cube, object_cylinder]
  obj_linvel:
    func: hw2_dexhand.tasks.allegro_inhand.terms.object_lin_vel_l1
    weight: -0.3
    params:
      entity_name: objects
      tensor_body_names: [object_ball, object_cube, object_cylinder]
  pose_diff:
    func: hw2_dexhand.tasks.allegro_inhand.terms.hand_pose_diff_from_reset
    weight: -0.3
    params:
      event_name: reset_from_grasp_caches
      asset_cfg:
        _target_: unilab.managers.SceneEntityCfg
        name: robot
  torque:
    func: hw2_dexhand.tasks.allegro_inhand.terms.hand_pd_torque_l2
    weight: -0.1
    params:
      kp: 1.0
      kd: 0.1
      torque_clip: 0.5
      action_name: hand
      asset_cfg:
        _target_: unilab.managers.SceneEntityCfg
        name: robot
  work:
    func: hw2_dexhand.tasks.allegro_inhand.terms.hand_pd_work_sq
    weight: -2.0
    params:
      kp: 1.0
      kd: 0.1
      torque_clip: 0.5
      action_name: hand
      asset_cfg:
        _target_: unilab.managers.SceneEntityCfg
        name: robot

algo:
  max_iterations: 400
